services:
  postgres:
    image: postgres:18-alpine
    container_name: midnight-database
    environment:
      POSTGRES_DB: midnight_database
      POSTGRES_USER: Glabay
      POSTGRES_PASSWORD: MidnightCoder
    ports:
      - "5442:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
      driver: local